# Local development services. Start with `pnpm db:up`, stop with `pnpm db:down`.
# Credentials here are for local dev only; real ones come from env vars in deployment.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chores
      POSTGRES_PASSWORD: chores
      POSTGRES_DB: chores
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chores -d chores"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for chore photos: RustFS (Apache-2.0), a
  # drop-in for MinIO, whose community images are no longer published.
  # Pinned: the project only adopts releases at least two weeks old.
  storage:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: chores
      RUSTFS_SECRET_KEY: chores-dev-secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - storagedata:/data

volumes:
  pgdata:
  storagedata:
