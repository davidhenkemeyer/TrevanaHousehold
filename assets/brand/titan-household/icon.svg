<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Titan Household app icon</title>
  <!--
    Master icon (full-bleed square). App stores apply their own corner mask,
    so this file must NOT be rounded. Spec: Titan Branding Suite §7.3.
      Background: 135° linear gradient, Warm Amber #D97706 → Soft Emerald #059669
      Mark: geometric "T" engine glyph in a gear, with a co-op progress ring
      Safe zone: 64 px padding on a 512 canvas (all artwork within 64–448)
  -->
  <defs>
    <!-- 135° in CSS terms = from top-left to bottom-right -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D97706" />
      <stop offset="1" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" />
  <g id="mark">
    <!-- Co-op progress ring: faint full track, then the bright progress arc (~72%) -->
    <circle cx="256" cy="256" r="168" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="22" />
    <circle cx="256" cy="256" r="168" fill="none" stroke="#FFFFFF" stroke-width="22"
      stroke-linecap="round" stroke-dasharray="760 1056" transform="rotate(-90 256 256)" />
    <!-- Engine gear: eight teeth around a ring -->
    <g fill="#FFFFFF">
      <rect id="tooth" x="241" y="130" width="30" height="36" rx="7" />
      <use href="#tooth" transform="rotate(45 256 256)" />
      <use href="#tooth" transform="rotate(90 256 256)" />
      <use href="#tooth" transform="rotate(135 256 256)" />
      <use href="#tooth" transform="rotate(180 256 256)" />
      <use href="#tooth" transform="rotate(225 256 256)" />
      <use href="#tooth" transform="rotate(270 256 256)" />
      <use href="#tooth" transform="rotate(315 256 256)" />
    </g>
    <circle cx="256" cy="256" r="100" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-width="20" />
    <!-- Geometric "T" -->
    <g fill="#FFFFFF">
      <rect x="200" y="206" width="112" height="28" rx="6" />
      <rect x="242" y="206" width="28" height="100" rx="6" />
    </g>
  </g>
</svg>
