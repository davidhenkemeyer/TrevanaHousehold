<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Tenara Family app icon (rounded preview)</title>
  <!--
    Preview only: the master icon inside an iOS-style rounded container
    (22.37% corner radius ≈ 114.5 px on 512). Use for docs and the web
    favicon; ship icon.svg to the app stores, which mask it themselves.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D97706" />
      <stop offset="1" stop-color="#059669" />
    </linearGradient>
    <clipPath id="container">
      <rect width="512" height="512" rx="114.5" />
    </clipPath>
  </defs>
  <g clip-path="url(#container)">
    <rect width="512" height="512" fill="url(#bg)" />
    <circle cx="256" cy="256" r="168" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="22" />
    <circle cx="256" cy="256" r="168" fill="none" stroke="#FFFFFF" stroke-width="22"
      stroke-linecap="round" stroke-dasharray="760 1056" transform="rotate(-90 256 256)" />
    <g fill="#FFFFFF">
      <rect id="tooth" x="241" y="130" width="30" height="36" rx="7" />
      <use href="#tooth" transform="rotate(45 256 256)" />
      <use href="#tooth" transform="rotate(90 256 256)" />
      <use href="#tooth" transform="rotate(135 256 256)" />
      <use href="#tooth" transform="rotate(180 256 256)" />
      <use href="#tooth" transform="rotate(225 256 256)" />
      <use href="#tooth" transform="rotate(270 256 256)" />
      <use href="#tooth" transform="rotate(315 256 256)" />
    </g>
    <circle cx="256" cy="256" r="100" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-width="20" />
    <g fill="#FFFFFF">
      <rect x="200" y="206" width="112" height="28" rx="6" />
      <rect x="242" y="206" width="28" height="100" rx="6" />
    </g>
  </g>
</svg>
