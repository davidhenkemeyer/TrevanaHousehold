name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # API integration tests need a real Postgres.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chores
          POSTGRES_PASSWORD: chores
          POSTGRES_DB: chores
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chores -d chores"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # The API test setup creates and migrates this database itself.
      TEST_DATABASE_URL: postgresql://chores:chores@localhost:5432/chores_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The static web build (what the web host serves).
      - run: pnpm --filter @tenara/mobile export:web

  # The production API image builds (catches Dockerfile breakage). Not pushed anywhere.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t tenara-api:ci .
